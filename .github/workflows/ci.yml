name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DevMemory has no native dependencies, so the same code should behave
        # identically on all three - this matrix is what proves it.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # The CLI must work from a clean build, not only under vitest.
      - name: smoke test the CLI
        run: |
          node apps/cli/dist/bin.js init
          node apps/cli/dist/bin.js connect .
          node apps/cli/dist/bin.js status
          node apps/cli/dist/bin.js doctor
